name: Keep Supabase Awake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping GitHub Pages catalog
        run: |
          curl --fail --silent --show-error --location \
            "https://pechenij.github.io/computerra-retail-site/?keepalive=$(date +%s)" \
            >/dev/null

      - name: Ping Supabase products API
        run: |
          curl --fail --silent --show-error \
            "https://jlhygrzbgwhdcmbdleat.supabase.co/rest/v1/products?select=id&is_active=eq.true&hidden_by_admin=eq.false&limit=1" \
            --header "apikey: sb_publishable_zuKn_8-8vUQAbCH_Daxxkw_OsmM0smV" \
            --header "Authorization: Bearer sb_publishable_zuKn_8-8vUQAbCH_Daxxkw_OsmM0smV" \
            --header "Accept: application/json" \
            >/dev/null
